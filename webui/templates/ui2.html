{% raw %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turb 控制台</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2.7.6/dist/index.css">
<script src="https://cdn.jsdelivr.net/npm/vue@3.4.31/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/element-plus@2.7.6/dist/index.full.min.js"></script>
<style>
  :root{
    --bg:#f8f9fa; --surface:#ffffff; --soft:#f7f9fc; --text:#172033; --muted:#667085;
    --line:#e3e9f2; --blue:#2563eb; --green:#16803c; --red:#c2413a; --amber:#b7791f;
    --sidebar:#141b2d; --sidebar-accent:#3b66f5;
  }
  *{box-sizing:border-box}
  html,body,#app{height:100%;margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--text);font-size:13px;-webkit-font-smoothing:antialiased}
  .shell{display:flex;height:100%}
  /* 侧边栏 */
  .side{width:216px;background:var(--sidebar);display:flex;flex-direction:column;flex-shrink:0}
  .brand{padding:20px;color:#fff;font-weight:600;font-size:15px;display:flex;align-items:center;gap:9px;
         border-bottom:1px solid rgba(255,255,255,.08);letter-spacing:.3px}
  .brand .dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 10px #22c55e}
  .menu{flex:1;padding:10px 0;overflow:auto}
  .menu-item{padding:10px 20px;font-size:13.5px;color:#9aa8bd;cursor:pointer;border-left:3px solid transparent;transition:.15s}
  .menu-item:hover{background:rgba(255,255,255,.06);color:#fff}
  .menu-item.active{background:rgba(59,102,245,.18);color:#fff;border-left-color:var(--sidebar-accent);font-weight:500}
  .side-foot{padding:14px 20px;font-size:11.5px;color:#5f6b80;border-top:1px solid rgba(255,255,255,.08)}
  /* 主区 */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{height:58px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;
          padding:0 22px;gap:12px;position:sticky;top:0;z-index:10}
  .topbar h2{margin:0;font-size:15.5px;font-weight:600;letter-spacing:.2px}
  .content{flex:1;overflow:auto;padding:18px 22px 40px}
  .inner{max-width:1560px;margin:0 auto;width:100%}
  /* 卡片 */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;
        box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .card + .card{margin-top:14px}
  .card-title{font-weight:600;font-size:13.5px;margin-bottom:12px;color:var(--text);
              display:flex;align-items:center;gap:8px}
  .card-title::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--blue)}
  /* 统计 */
  .funnel{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
  .fitem{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;
         box-shadow:0 1px 2px rgba(16,24,40,.04);position:relative;overflow:hidden}
  .fitem::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--blue);opacity:.85}
  .fitem.g::after{background:var(--green)} .fitem.r::after{background:var(--red)} .fitem.a::after{background:var(--amber)}
  .fitem .k{font-size:12px;color:var(--muted)}
  .fitem .v{font-size:22px;font-weight:600;margin-top:5px;letter-spacing:.5px}
  /* 工具条 */
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .toolbar .muted{font-size:12px;color:var(--muted)}
  .right{margin-left:auto}
  /* 表格 */
  .el-table{font-size:12.5px}
  .el-table th{background:#f7f9fc!important;color:#475569;font-weight:600}
  .email-cell{display:flex;flex-direction:column;line-height:1.4}
  .email-cell .sub{font-size:11.5px;color:#94a3b8}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
  .muted{color:var(--muted)}
  .logbox{background:#0f172a;color:#cbd5e1;padding:14px;border-radius:8px;font-size:12px;line-height:1.65;
          white-space:pre-wrap;word-break:break-all;max-height:78vh;overflow:auto}
</style>
</head>
<body>
<div id="app">
  <div class="shell">
    <aside class="side">
      <div class="brand"><span class="dot"></span> Turb 控制台</div>
      <nav class="menu">
        <div v-for="m in menus" :key="m.key" class="menu-item" :class="{active:tab===m.key}" @click="switchTab(m.key)">{{ m.label }}</div>
      </nav>
      <div class="side-foot">v2 · Element Plus</div>
    </aside>
    <section class="main">
      <header class="topbar">
        <h2>{{ title }}</h2>
        <span class="right"></span>
        <span class="muted" style="font-size:12px;">注册</span>
        <el-switch v-model="regRunning" :active-text="regRunning ? '运行中' : '已暂停'"
                   inline-prompt style="--el-switch-on-color:#13ce66;margin-right:12px"
                   @change="toggleRegistration" />
        <el-button size="small" @click="reload">刷新</el-button>
        <el-button size="small" text tag="a" href="/">返回旧版</el-button>
      </header>
      <main class="content"><div class="inner">
        <template v-if="tab==='pool'">
          <div class="card" style="margin-bottom:14px;">
            <div class="toolbar">
              <span class="muted">来源</span>
              <el-select v-model="poolSource" style="width:200px" @change="loadPool">
                <el-option v-for="s in poolSources" :key="s.value" :label="s.label" :value="s.value" />
              </el-select>
              <el-input v-model="poolQuery" placeholder="搜索邮箱" clearable style="width:220px" @keyup.enter="reloadPool" />
              <el-button type="primary" @click="reloadPool">查询</el-button>
              <span class="right"></span>
              <el-button type="success" @click="importOpen = true">导入邮箱</el-button>
              <el-button type="danger" plain :disabled="!poolSel.length" @click="deletePool">删除所选</el-button>
            </div>
            <el-table :data="poolRows" empty-text="该来源下没有邮箱" v-loading="busy==='pool'" size="small" border stripe
                      @selection-change="v=>poolSel=v" style="width:100%">
              <el-table-column type="selection" width="42" />
              <el-table-column label="邮箱" min-width="260"><template #default="{row}">{{ row.email }}</template></el-table-column>
              <el-table-column label="状态" width="120">
                <template #default="{row}"><el-tag size="small" :type="row.status==='available'?'success':'info'">{{ row.status || '-' }}</el-tag></template>
              </el-table-column>
              <el-table-column label="已用次数" width="100"><template #default="{row}">{{ row.used_count ?? 0 }}</template></el-table-column>
              <el-table-column label="更新时间" width="164"><template #default="{row}">{{ fmt(row.updated_at) }}</template></el-table-column>
            </el-table>
            <div style="display:flex;justify-content:flex-end;margin-top:12px">
              <el-pagination background layout="total, prev, pager, next" :total="poolTotal" :page-size="50"
                             :current-page="poolPage" @current-change="onPoolPage" />
            </div>
          </div>
          <el-dialog v-model="importOpen" title="导入邮箱" width="640px">
            <div class="toolbar">
              <span class="muted">类型</span>
              <el-select v-model="importSource" style="width:180px">
                <el-option label="Outlook" value="outlook" />
                <el-option label="通用 API" value="generic_api" />
                <el-option label="通用 IMAP" value="imap" />
              </el-select>
              <template v-if="importSource==='imap'">
                <span class="muted">IMAP 服务器</span>
                <el-input v-model="imapServer" placeholder="imap.example.com:993" style="width:220px" />
              </template>
            </div>
            <el-input v-model="importText" type="textarea" :rows="9" style="margin-top:10px"
                      placeholder="Outlook: email----password----clientId----refreshToken&#10;通用 API: email----code_url&#10;IMAP: email----password" />
            <template #footer>
              <el-button @click="importOpen = false">取消</el-button>
              <el-button type="primary" :loading="busy==='imp'" @click="doImport">导入</el-button>
            </template>
          </el-dialog>
        </template>
        <template v-else-if="tab==='register'">
          <div class="card" style="margin-bottom:14px;">
            <div class="card-title">注册总开关</div>
            <div class="toolbar">
              <el-switch v-model="regRunning" :active-text="regRunning ? '运行中' : '已暂停'" inline-prompt
                         style="--el-switch-on-color:#13ce66" @change="toggleRegistration" />
              <span class="muted">暂停后不再接受任何新任务（含重启补偿与手动提交）</span>
            </div>
          </div>
          <div class="card" style="margin-bottom:14px;">
            <div class="card-title">发起注册</div>
            <div class="toolbar">
              <span class="muted">数量</span>
              <el-input-number v-model="regCount" :min="1" :max="200" size="default" style="width:130px" />
              <span class="muted">并发</span>
              <el-input-number v-model="regWorkers" :min="1" :max="10" size="default" style="width:110px" />
              <span class="muted">邮箱来源</span>
              <el-select v-model="regSource" style="width:230px">
                <el-option v-for="o in sourceOptions" :key="o.value" :label="o.label" :value="o.value" />
              </el-select>
              <span class="muted">驱动</span>
              <el-select v-model="regDriver" style="width:150px" clearable placeholder="跟随配置">
                <el-option v-for="d in driverOptions" :key="d" :label="d" :value="d" />
              </el-select>
              <el-button type="primary" :loading="busy==='reg'" :disabled="!regRunning" @click="startRegistration">
                开始注册
              </el-button>
            </div>
            <el-alert v-if="!regRunning" type="warning" :closable="false" show-icon
                      title="当前已暂停：请先打开上方开关再发起注册。" />
          </div>
          <div class="card">
            <div class="card-title">队列状态</div>
            <el-descriptions :column="4" border size="small">
              <el-descriptions-item label="待执行">{{ jobCounts.pending ?? 0 }}</el-descriptions-item>
              <el-descriptions-item label="执行中">{{ jobCounts.running ?? 0 }}</el-descriptions-item>
              <el-descriptions-item label="成功">{{ jobCounts.success ?? 0 }}</el-descriptions-item>
              <el-descriptions-item label="失败">{{ jobCounts.failed ?? 0 }}</el-descriptions-item>
            </el-descriptions>
            <div style="margin-top:12px;">
              <el-button size="small" @click="switchTab('logs')">查看任务与日志 →</el-button>
            </div>
          </div>
        </template>
        <template v-else-if="tab==='accounts'">
          <div class="funnel" v-if="funnel">
            <div class="fitem"><div class="k">作业总数</div><div class="v">{{ funnel.total }}</div></div>
            <div class="fitem"><div class="k">成功</div><div class="v">{{ (funnel.status||{}).success || 0 }}</div></div>
            <div class="fitem"><div class="k">部分成功</div><div class="v">{{ (funnel.status||{}).partial_success || 0 }}</div></div>
            <div class="fitem"><div class="k">失败</div><div class="v">{{ (funnel.status||{}).failed || 0 }}</div></div>
            <div class="fitem"><div class="k">Codex 未跑</div><div class="v">{{ (funnel.sub_status||{})['codex_status:skipped'] || 0 }}</div></div>
            <div class="fitem"><div class="k">Codex 失败</div><div class="v">{{ (funnel.sub_status||{})['codex_status:failed'] || 0 }}</div></div>
          </div>
          <div class="card">
            <div class="toolbar">
              <el-input v-model="query" placeholder="搜索邮箱/备注" clearable style="width:220px" @keyup.enter="reload"/>
              <el-select v-model="archived" style="width:120px" @change="reload">
                <el-option label="默认账号" value="0"/><el-option label="已归档" value="only"/>
              </el-select>
              <el-button type="primary" @click="reload">查询</el-button>
              <span class="right"></span>
              <el-button :disabled="!sel.length" :loading="busy==='live'" @click="bulk('live')">批量查活</el-button>
              <el-button :disabled="!sel.length" :loading="busy==='totp'" @click="bulk('totp')">开 2FA</el-button>
              <el-button :disabled="!sel.length" :loading="busy==='cpa'" @click="bulk('cpa')">导出凭据</el-button>
              <el-button :disabled="!sel.length" :loading="busy==='codex'" @click="backfillCodex">Codex 补跑</el-button>
              <el-button :disabled="!sel.length" :loading="busy==='plan'" @click="bulk('plan')">查套餐</el-button>
              <el-button :disabled="!sel.length" :loading="busy==='link'" @click="bulk('link')">提取链接</el-button>
              <el-button :disabled="!sel.length" :loading="busy==='note'" @click="bulkNote">批量备注</el-button>
              <el-button :disabled="!sel.length" :loading="busy==='secret'" @click="bulk('secret')">查看密钥</el-button>
              <el-button :disabled="!sel.length" :loading="busy==='cxcheck'" @click="bulk('cxcheck')">Codex 测活</el-button>
              <el-button :disabled="!sel.length" :loading="busy==='chgmail'" @click="bulkChangeEmail">换邮箱</el-button>
              <el-button :disabled="!sel.length" @click="bulk('archive')">归档</el-button>
              <el-button :loading="busy==='cleanup'" @click="cleanupDead">清理已废</el-button>
              <el-button :loading="busy==='cancelq'" @click="cancelPending">取消排队</el-button>
              <el-button type="danger" plain :disabled="!sel.length" :loading="busy==='del'" @click="bulk('del')">删除</el-button>
            </div>
            <el-table :data="rows" v-loading="loading" size="small" border stripe @selection-change="v=>sel=v" style="width:100%">
              <el-table-column type="selection" width="42"/>
              <el-table-column label="ID" width="76"><template #default="{row}">#{{ row.id }}</template></el-table-column>
              <el-table-column label="邮箱" min-width="230">
                <template #default="{row}">
                  <div class="email-cell"><span>{{ row.email }}</span><span class="sub">{{ row.user_name || '-' }}</span></div>
                </template>
              </el-table-column>
              <el-table-column label="来源" width="104"><template #default="{row}">{{ row.email_source || '-' }}</template></el-table-column>
              <el-table-column label="套餐" width="92">
                <template #default="{row}"><el-tag size="small" :type="row.plan_type==='plus'?'warning':'info'">{{ row.plan_type || 'free' }}</el-tag></template>
              </el-table-column>
              <el-table-column label="Codex" width="104">
                <template #default="{row}"><el-tag size="small" :type="tagType('codex',row.codex_status)">{{ row.codex_status || '未开始' }}</el-tag></template>
              </el-table-column>
              <el-table-column label="测活" width="98">
                <template #default="{row}"><el-tag size="small" :type="tagType('live',row.live_check_status)">{{ row.live_check_status || '-' }}</el-tag></template>
              </el-table-column>
              <el-table-column label="密码" width="86">
                <template #default="{row}"><el-tag size="small" v-if="row.registration_password" type="success">已设</el-tag><el-tag size="small" v-else type="warning">缺失</el-tag></template>
              </el-table-column>
              <el-table-column label="创建时间" width="164"><template #default="{row}">{{ fmt(row.created_at) }}</template></el-table-column>
            </el-table>
            <div style="display:flex;justify-content:flex-end;margin-top:12px">
              <el-pagination background layout="total, sizes, prev, pager, next" :total="total" :page-size="pageSize"
                             :current-page="page" :page-sizes="[20,50,100]" @current-change="onPage" @size-change="onSize"/>
            </div>
          </div>
        </template>
        <template v-else-if="tab==='sms'">
          <div class="funnel">
            <div class="fitem"><div class="k">总开关</div><div class="v">{{ sms.enabled ? '开启' : '关闭' }}</div></div>
            <div class="fitem"><div class="k">状态</div><div class="v">{{ sms.paused ? '已暂停' : '运行中' }}</div></div>
            <div class="fitem"><div class="k">并发 / 预热</div><div class="v">{{ sms.workers || '-' }} / {{ sms.prewarm ?? '-' }}</div></div>
            <div class="fitem"><div class="k">候选账号</div><div class="v">{{ (smsEligible||[]).length }}</div></div>
            <div class="fitem"><div class="k">占用中</div><div class="v">{{ (smsReservations||[]).length }}</div></div>
          </div>
          <div class="card" style="margin-bottom:14px;">
            <div class="toolbar">
              <el-button :loading="busy==='sms'" @click="loadSms">刷新</el-button>
              <el-button type="primary" :loading="busy==='sms'" @click="smsToggle">{{ sms.paused ? '恢复' : '暂停' }}</el-button>
              <span class="right"></span>
              <span class="muted">候选按"查活可用"筛选；仅展示前 50 条</span>
            </div>
            <el-table :data="smsEligible" empty-text="没有可分配号码的账号" size="small" border stripe v-loading="busy==='sms'" style="width:100%">
              <el-table-column label="ID" width="76"><template #default="{row}">#{{ row.id }}</template></el-table-column>
              <el-table-column label="邮箱" min-width="220"><template #default="{row}">{{ row.email }}</template></el-table-column>
              <el-table-column label="套餐" width="92"><template #default="{row}">{{ row.plan_type || row.current_plan_type || 'free' }}</template></el-table-column>
              <el-table-column label="Codex" width="104"><template #default="{row}"><el-tag size="small" :type="tagType('codex',row.codex_status)">{{ row.codex_status || '未开始' }}</el-tag></template></el-table-column>
              <el-table-column label="测活" width="98"><template #default="{row}"><el-tag size="small" :type="tagType('live',row.live_check_status)">{{ row.live_check_status || '-' }}</el-tag></template></el-table-column>
            </el-table>
          </div>
          <div class="card">
            <div class="card-title">号码占用</div>
            <el-table :data="smsReservations" size="small" border stripe style="width:100%">
              <el-table-column label="ID" width="70"><template #default="{row}">#{{ row.id }}</template></el-table-column>
              <el-table-column label="号码" width="140"><template #default="{row}">{{ row.phone_mask || row.phone || '-' }}</template></el-table-column>
              <el-table-column label="状态" width="110"><template #default="{row}"><el-tag size="small">{{ row.status || '-' }}</el-tag></template></el-table-column>
              <el-table-column label="账号" min-width="200"><template #default="{row}">{{ row.email || row.account_id || '-' }}</template></el-table-column>
              <el-table-column label="过期" width="164"><template #default="{row}">{{ fmt(row.expires_at) }}</template></el-table-column>
            </el-table>
          </div>
        </template>
        <template v-else-if="tab==='codex'">
          <div class="card">
            <div class="toolbar">
              <el-input v-model="cxQuery" placeholder="搜索文件名/邮箱" clearable style="width:240px" @keyup.enter="loadCodex"/>
              <el-button type="success" @click="openManualOauth">人工授权</el-button>
              <el-button type="primary" @click="loadCodex">查询</el-button>
              <span class="right"></span>
              <el-button :disabled="!cxSel.length" :loading="busy==='cxretry'" @click="cxBulk('retry')">重试</el-button>
              <el-button :disabled="!cxSel.length" :loading="busy==='cxstop'" @click="cxBulk('stop')">停止</el-button>
              <el-button :disabled="!cxSel.length" :loading="busy==='cxdl'" @click="cxBulk('download')">批量下载</el-button>
              <el-button :disabled="!cxSel.length" :loading="busy==='cxdlcpa'" @click="cxBulk('cpa')">从 CPA 下载</el-button>
              <el-button :disabled="!cxSel.length" @click="cxBulk('archive')">归档</el-button>
              <el-button type="danger" plain :disabled="!cxSel.length" :loading="busy==='cxdel'" @click="cxBulk('delete')">删除</el-button>
              <span class="muted">共 {{ cxTotal }} 条</span>
            </div>
            <el-table :data="cxRows" empty-text="暂无凭据" v-loading="busy==='codex'" size="small" border stripe style="width:100%">
              <el-table-column label="文件" min-width="300">
                <template #default="{row}"><span class="mono">{{ row.filename }}</span></template>
              </el-table-column>
              <el-table-column label="邮箱" min-width="220"><template #default="{row}">{{ row.email || '-' }}</template></el-table-column>
              <el-table-column label="套餐" width="96"><template #default="{row}">{{ row.plan || row.plan_type || '-' }}</template></el-table-column>
              <el-table-column label="导出次数" width="96"><template #default="{row}">{{ row.exported_count ?? 0 }}</template></el-table-column>
              <el-table-column label="更新时间" width="164"><template #default="{row}">{{ fmt(row.updated_at) }}</template></el-table-column>
              <el-table-column label="操作" width="150">
                <template #default="{row}">
                  <el-button size="small" text tag="a" :href="'/api/codex/download/' + encodeURIComponent(row.filename)">下载</el-button>
                  <el-button size="small" text type="danger" @click="deleteCodex(row)">删除</el-button>
                </template>
              </el-table-column>
            </el-table>
            <div style="display:flex;justify-content:flex-end;margin-top:12px">
              <el-pagination background layout="total, prev, pager, next" :total="cxTotal" :page-size="cxPageSize"
                             :current-page="cxPage" @current-change="onCodexPage"/>
            </div>
          </div>
        </template>
        <template v-else-if="tab==='logs'">
          <div class="card">
            <div class="toolbar">
              <el-button :loading="busy==='jobs'" @click="loadJobs">刷新</el-button>
              <span class="right"></span>
              <span class="muted">最近 {{ jobRows.length }} 条任务</span>
            </div>
            <el-table :data="jobRows" empty-text="暂无任务" v-loading="busy==='jobs'" size="small" border stripe style="width:100%">
              <el-table-column label="ID" width="76"><template #default="{row}">#{{ row.id }}</template></el-table-column>
              <el-table-column label="邮箱" min-width="220"><template #default="{row}">{{ row.email || '-' }}</template></el-table-column>
              <el-table-column label="状态" width="120">

              <el-table-column label="阶段" width="120"><template #default="{row}">{{ row.phase || '-' }}</template></el-table-column>
              <el-table-column label="Codex" width="104"><template #default="{row}"><el-tag size="small" :type="tagType('codex',row.codex_status)">{{ row.codex_status || '-' }}</el-tag></template></el-table-column>
              <el-table-column label="错误码" width="150"><template #default="{row}">{{ row.error_code || '-' }}</template></el-table-column>

              <el-table-column label="操作" width="190">

                  <el-button size="small" text type="warning" @click="stopJob(row)">停止</el-button>

            </el-table>
          </div>
          <el-dialog v-model="manualOauthOpen" title="人工 OAuth 授权" width="640px">
            <el-steps :active="oauthStep" simple style="margin-bottom:16px">
              <el-step title="生成链接" /><el-step title="浏览器授权" /><el-step title="粘贴回调" />
            </el-steps>
            <div class="toolbar">
              <el-input v-model="oauthEmail" placeholder="账号邮箱（可选）" style="width:260px" />
              <el-button type="primary" :loading="oauthBusy" @click="startOauth">生成授权链接</el-button>
            </div>
            <el-input v-if="oauthUrl" v-model="oauthUrl" readonly type="textarea" :rows="3" style="margin:10px 0" />
            <el-alert v-if="oauthUrl" type="info" :closable="false" show-icon

            <el-input v-model="oauthCallback" placeholder="粘贴 http://localhost:1455/auth/callback?code=...&state=..." type="textarea" :rows="3" style="margin:12px 0" />
            <template #footer>
              <el-button @click="manualOauthOpen = false">关闭</el-button>
              <el-button type="primary" :loading="oauthBusy" @click="finishOauth">提交回调</el-button>
            </template>
          </el-dialog>
          <el-drawer v-model="logOpen" :title="'Job #' + logJobId + ' 日志'" size="56%">
            <pre class="logbox">{{ logText || '（暂无日志）' }}</pre>

        </template>
        <template v-else-if="tab==='config'">
          <div class="card">
            <div class="toolbar">
              <el-select v-model="cfgGroup" style="width:200px" placeholder="选择分组">
                <el-option v-for="g in cfgGroups" :key="g" :label="g" :value="g" />
              </el-select>
              <el-input v-model="cfgFilter" placeholder="按名称/键筛选" clearable style="width:240px" />
              <el-button :loading="busy==='cfg'" @click="loadConfig">重新加载</el-button>
              <span class="right"></span>
              <span class="muted">改动 {{ Object.keys(cfgDirty).length }} 项</span>
              <el-button type="primary" :loading="busy==='cfgsave'" :disabled="!Object.keys(cfgDirty).length"
                         @click="saveConfig">保存配置</el-button>
            </div>
            <el-table :data="cfgVisible" size="small" border style="width:100%" >
              <el-table-column label="配置项" width="260">
                <template #default="{row}">
                  <div class="email-cell">
                    <span>{{ row.label || row.key }}</span>
                    <span class="sub mono">{{ row.key }}</span>
                  </div>
                </template>
              </el-table-column>
              <el-table-column label="值" min-width="320">
                <template #default="{row}">
                  <el-switch v-if="row.type==='bool'" v-model="cfgDraft[row.key]" />
                  <el-input v-else-if="row.type==='int'||row.type==='float'" type="number" v-model="cfgDraft[row.key]" />
                  <el-input v-else-if="row.type==='list_str_multiline'" type="textarea" :rows="3" v-model="cfgDraft[row.key]" />
                  <el-input v-else :type="row.secret ? 'password' : 'text'" show-password v-model="cfgDraft[row.key]" />
                </template>
              </el-table-column>
              <el-table-column label="说明" min-width="260">
                <template #default="{row}"><span class="muted">{{ row.help || '-' }}</span></template>
              </el-table-column>
            </el-table>
          </div>
        </template>
        <template v-else-if="tab==='settings'">
          <div class="card" style="margin-bottom:14px;">
            <div class="card-title">运行开关</div>
            <div class="toolbar">
              <span class="muted" style="width:120px;">注册</span>
              <el-switch v-model="regRunning" :active-text="regRunning ? '运行中' : '已暂停'" inline-prompt
                         @change="toggleRegistration" />
            </div>
            <el-alert type="info" :closable="false" show-icon
                      title="暂停后不再接受任何新的注册任务（含重启补偿）；手动提交也会被拒绝。" />
          </div>
          <div class="card" style="margin-bottom:14px;">
            <div class="card-title">关键配置</div>
            <el-descriptions :column="2" border size="small">
              <el-descriptions-item label="2FA 开关">{{ cfg.enable_2fa ? '开启' : '关闭' }}</el-descriptions-item>
              <el-descriptions-item label="2FA 并发">{{ cfg.twofa_workers }}</el-descriptions-item>
              <el-descriptions-item label="2FA 取码窗口">{{ cfg.twofa_otp_max_wait }} 秒</el-descriptions-item>
              <el-descriptions-item label="OTP 全局窗口">{{ cfg.otp_max_wait }} 秒</el-descriptions-item>
              <el-descriptions-item label="Codex 自动">{{ cfg.enable_codex_auto ? '开启' : '关闭' }}</el-descriptions-item>
              <el-descriptions-item label="强制密码注册">{{ cfg.require_password ? '是' : '否' }}</el-descriptions-item>
              <el-descriptions-item label="重启补偿">{{ cfg.auto_requeue_on_restart ? '开启' : '关闭' }}</el-descriptions-item>
              <el-descriptions-item label="注册驱动">{{ cfg.registration_driver }}</el-descriptions-item>

          </div>
          <div class="card">
            <div class="card-title">本地凭据与备份</div>
            <el-descriptions :column="2" border size="small">
              <el-descriptions-item label="本地凭据文件">{{ (creds.count ?? 0) }} 个</el-descriptions-item>
              <el-descriptions-item label="占用空间">{{ ((creds.bytes || 0) / 1024).toFixed(1) }} KB</el-descriptions-item>
              <el-descriptions-item label="数据库快照">{{ (backups.count ?? 0) }} 份</el-descriptions-item>
              <el-descriptions-item label="最新快照">{{ backups.latest || '—' }}</el-descriptions-item>
            </el-descriptions>
          </div>
        </template>
      </div></main>
    </section>
  </div>
</div><script>
const { createApp, ref, computed, onMounted } = Vue;
const { ElMessage, ElMessageBox } = ElementPlus;

async function api(path, options) {
  const res = await fetch(path, Object.assign({ credentials: 'include' }, options || {}));
  if (!res.ok) { let d = ''; try { d = (await res.text()).slice(0, 140); } catch (e) {} throw new Error('HTTP ' + res.status + ' ' + d); }
  const ct = res.headers.get('content-type') || '';
  return ct.includes('json') ? res.json() : res.text();
}
const post = (p, body) => api(p, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });

createApp({
  setup() {
    const menus = [
      { key: 'register', label: '注册' },
      { key: 'pool', label: '邮箱池' },
      { key: 'accounts', label: '账号管理' },
      { key: 'sms', label: '号码池' },
      { key: 'codex', label: 'Codex 凭证' },
      { key: 'logs', label: '任务与日志' },
      { key: 'config', label: '配置' },
      { key: 'settings', label: '设置' },
    ];
    const tab = ref('accounts');
    const title = computed(() => (menus.find(m => m.key === tab.value) || {}).label || '');
    const busy = ref('');

    /* ---------- 账号 ---------- */
    const rows = ref([]), total = ref(0), page = ref(1), pageSize = ref(20);
    const loading = ref(false), query = ref(''), archived = ref('0'), sel = ref([]), funnel = ref(null);
    async function load() {
      loading.value = true;
      try {
        const qs = new URLSearchParams({ paged: '1', page: String(page.value), page_size: String(pageSize.value), archived: archived.value, q: query.value });
        const d = await api('/api/accounts?' + qs.toString());
        rows.value = d.items || [];
        total.value = Number(d.total || rows.value.length || 0);
      } catch (e) { ElMessage.error('加载失败：' + e.message); }
      finally { loading.value = false; }
    }
    async function loadFunnel() {
      try { funnel.value = await api('/api/funnel?limit=500'); } catch (e) { funnel.value = null; }
    }
    function reload() { page.value = 1; load(); }
    function onPage(p) { page.value = p; load(); }
    function onSize(s) { pageSize.value = s; page.value = 1; load(); }
    const ids = () => sel.value.map(r => Number(r.id));
    async function bulk(kind) {
      const list = ids();
      if (!list.length) return;
      busy.value = kind;
      try {
        if (kind === 'live') { const r = await post('/api/accounts/check-live-bulk', { account_ids: list, workers: 4 }); ElMessage.success('已提交查活：' + (r.started_count ?? list.length)); }
        else if (kind === 'totp') { const r = await post('/api/accounts/totp-setup-bulk', { account_ids: list }); ElMessage.success('已提交 2FA：' + (r.started_count ?? list.length)); }
        else if (kind === 'cpa') { const r = await post('/api/accounts/download-cpa-bulk', { account_ids: list, prepare: true }); ElMessage.success('已准备导出：' + (r.count ?? r.prepared_count ?? list.length)); }
        else if (kind === 'plan') { const r = await post('/api/accounts/check-plan-bulk', { account_ids: list, workers: 4 }); ElMessage.success('已提交查套餐：' + (r.started_count ?? list.length)); }
        else if (kind === 'link') { const r = await post('/api/accounts/extract-link-bulk', { account_ids: list }); ElMessage.success('已提交提取链接：' + (r.started_count ?? list.length)); }
        else if (kind === 'secret') { const r = await post('/api/accounts/secret-bulk', { account_ids: list }); ElMessage.success('已提交取密钥：' + (r.started_count ?? list.length)); }
        else if (kind === 'archive') { const r = await post('/api/accounts/archive-bulk', { account_ids: list, archived: archived.value !== 'only' }); ElMessage.success('归档处理完成：' + (r.archived ?? list.length)); }
        else if (kind === 'del') {
          await ElMessageBox.confirm('删除 ' + list.length + ' 个账号？不可恢复。', '确认删除', { type: 'warning' });
          const r = await post('/api/accounts/delete-bulk', { account_ids: list });
          ElMessage.success('已删除：' + (r.deleted_count ?? list.length));
        }
        await load(); await loadFunnel();
      } catch (e) { if (e !== 'cancel') ElMessage.error('操作失败：' + (e.message || e)); }
      finally { busy.value = ''; }
    }
    async function bulkChangeEmail() {
      const list = ids();
      if (!list.length) return;
      try {
        const d = await post('/api/accounts/change-email-bulk', {account_ids: list, source: 'auto'});
        if (d.ok === false) throw new Error(d.error || '提交失败');
        ElMessage.success('已提交换邮箱：' + (d.started_count ?? list.length));
        await load();
      } catch (e) { if (e !== 'cancel') ElMessage.error('换邮箱失败：' + (e.message || e)); }
    }

    async function cleanupDead() {
      try {
        await ElMessageBox.confirm('清理已判定为已废的账号？该操作会删除数据。', '确认', {type:'warning'});
        busy.value = 'cleanup';
        const d = await post('/api/accounts/cleanup-dead', {max_batch: 50, force: false});
        ElMessage.success('清理完成：' + (d.deleted_count ?? d.deleted ?? 0));
        await load(); await loadFunnel();
      } catch (e) { if (e !== 'cancel') ElMessage.error('清理失败：' + (e.message || e)); }
      finally { busy.value = ''; }
    }

    async function cancelPending() {
      try {
        busy.value = 'cancelq';
        const d = await post('/api/jobs/cancel-pending', {});
        ElMessage.success('已取消排队：' + (d.cancelled ?? 0));
        await loadCounts();
      } catch (e) { ElMessage.error('取消失败：' + e.message); }
      finally { busy.value = ''; }
    }

    async function bulkNote() {
      const list = ids();
      if (!list.length) return;
      try {
        const { value } = await ElMessageBox.prompt('输入要写入的备注（空=清空）', '批量备注', { inputValue: '' });
        await post('/api/accounts/note-bulk', { account_ids: list, note: value || '' });
        ElMessage.success('备注已更新');
        await load();
      } catch (e) { if (e !== 'cancel') ElMessage.error('备注失败：' + (e.message || e)); }
    }
    async function backfillCodex() {
      busy.value = 'codex';
      try {
        const r = await post('/api/codex/backfill', { limit: Math.min(ids().length || 10, 50) });
        ElMessage.success('Codex 补跑已入队：' + ((r.queued || []).length));
        await loadFunnel();
      } catch (e) { ElMessage.error('补跑失败：' + e.message); }
      finally { busy.value = ''; }
    }
    const tagType = (kind, s) => kind === 'codex'
      ? ({ success: 'success', failed: 'danger', pending: 'warning', blocked: 'warning' }[s] || 'info')
      : ({ live: 'success', deactivated: 'danger', failed: 'danger' }[s] || 'info');
    const fmt = (v) => String(v || '').replace('T', ' ').slice(0, 19) || '-';

    /* ---------- 注册开关 ---------- */
    const regRunning = ref(true);
    async function loadSwitch() {
      try { const s = await api('/api/registration/switch'); regRunning.value = !(s && s.paused); } catch (e) {}
    }
    async function toggleRegistration(val) {
      try {
        await post('/api/registration/switch', { paused: !val, reason: 'ui' });
        ElMessage.success(val ? '注册已恢复' : '注册已暂停');
      } catch (e) { ElMessage.error('切换失败：' + e.message); regRunning.value = !val; }
    }

    /* ---------- 注册页 ---------- */
    const regCount = ref(1), regWorkers = ref(4), regSource = ref('auto'), regDriver = ref('');
    const sourceOptions = ref([{ value: 'auto', label: '自动（按配置顺序）' }]);
    const driverOptions = ['protocol', 'cloak', 'roxy', 'browser_use', 'skyvern'];
    const jobCounts = ref({});
    async function loadSources() {
      try { const d = await api('/api/registration/email-sources'); if (d.options) sourceOptions.value = d.options; } catch (e) {}
    }
    async function loadCounts() {
      try { const d = await api('/api/jobs?limit=1&paged=1'); jobCounts.value = d.status_counts || {}; } catch (e) {}
    }
    async function startRegistration() {
      busy.value = 'reg';
      try {
        const body = { count: regCount.value, workers: regWorkers.value, email_source: regSource.value };
        if (regDriver.value) body.driver = regDriver.value;
        const d = await post('/api/jobs', body);
        if (d.ok === false) throw new Error(d.error || '提交失败');
        ElMessage.success('已提交任务');
        await loadCounts();
      } catch (e) { ElMessage.error('提交失败：' + e.message); }
      finally { busy.value = ''; }
    }

    /* ---------- 邮箱池 ---------- */
    const poolSources = [
      { value: 'outlook', label: 'Outlook' },
      { value: 'generic_api', label: '通用 API' },
      { value: 'imap', label: '通用 IMAP' },
      { value: 'cloudflare_domain', label: '域名邮箱' },
    ];
    const poolSource = ref('outlook'), poolRows = ref([]), poolTotal = ref(0);
    const poolPage = ref(1), poolQuery = ref(''), poolSel = ref([]);
    const importOpen = ref(false), importText = ref(''), importSource = ref('outlook'), imapServer = ref('');
    async function loadPool() {
      busy.value = 'pool';
      try {
        const qs = new URLSearchParams({ paged: '1', page: String(poolPage.value), page_size: '50', source: poolSource.value, q: poolQuery.value });
        const d = await api('/api/outlook?' + qs.toString());
        poolRows.value = d.items || d.emails || [];
        poolTotal.value = Number(d.total || poolRows.value.length || 0);
      } catch (e) { ElMessage.error('邮箱池加载失败：' + e.message); }
      finally { busy.value = ''; }
    }
    function reloadPool() { poolPage.value = 1; loadPool(); }
    function onPoolPage(p) { poolPage.value = p; loadPool(); }
    async function deletePool() {
      const list = poolSel.value.map(r => r.email);
      if (!list.length) return;
      try {
        await ElMessageBox.confirm('删除 ' + list.length + ' 个邮箱？', '确认', { type: 'warning' });
        await post('/api/outlook/delete-bulk', { emails: list, source: poolSource.value });
        ElMessage.success('已删除');
        await loadPool();
      } catch (e) { if (e !== 'cancel') ElMessage.error('删除失败：' + (e.message || e)); }
    }
    async function doImport() {
      busy.value = 'imp';
      try {
        const body = { source: importSource.value, text: importText.value };
        if (importSource.value === 'imap' && imapServer.value) body.imap_server = imapServer.value;
        const d = await post('/api/outlook/import', body);
        if (d.ok === false) throw new Error(d.error || '导入失败');
        ElMessage.success('已导入 ' + (d.imported ?? d.count ?? 0) + ' 条');
        importOpen.value = false; importText.value = '';
        await loadPool();
      } catch (e) { ElMessage.error('导入失败：' + e.message); }
      finally { busy.value = ''; }
    }

    /* ---------- 号码池 ---------- */
    const sms = ref({}), smsEligible = ref([]), smsReservations = ref([]);
    async function loadSms() {
      busy.value = 'sms';
      try {
        const st = await api('/api/sms-pool/status');
        sms.value = st || {};
        try { const e = await api('/api/sms-pool/eligible'); smsEligible.value = (e.items || e.accounts || e || []).slice(0, 50); } catch (e2) { smsEligible.value = []; }
        try { const r = await api('/api/sms-pool/reservations'); smsReservations.value = (r.items || r.reservations || r || []).slice(0, 50); } catch (e3) { smsReservations.value = []; }
      } catch (e) { ElMessage.error('号码池加载失败：' + e.message); }
      finally { busy.value = ''; }
    }
    async function smsToggle() {
      try { await post('/api/sms-pool/toggle', { paused: !sms.value.paused }); await loadSms(); }
      catch (e) { ElMessage.error('操作失败：' + e.message); }
    }

    /* ---------- Codex ---------- */
    const cxRows = ref([]), cxTotal = ref(0), cxPage = ref(1), cxPageSize = ref(50), cxQuery = ref('');
    const cxSel = ref([]);
    async function cxBulk(kind) {
      const files = cxSel.value.map(r => r.filename).filter(Boolean);
      // retry/stop 走的是 account_ids，不是 filenames（后端字段不同，传错会 400）
      const ids = cxSel.value.map(r => Number(r.account_id)).filter(n => n > 0);
      if (!files.length) return;
      busy.value = kind === 'retry' ? 'cxretry' : kind === 'stop' ? 'cxstop'
        : kind === 'download' ? 'cxdl' : kind === 'cpa' ? 'cxdlcpa'
        : kind === 'archive' ? '' : 'cxdel';
      try {
        if (kind === 'retry') {
          if (!ids.length) throw new Error('这些凭据没有绑定账号 id');
          await post('/api/codex/retry-bulk', {account_ids: ids});
          ElMessage.success('已提交重试 ' + ids.length + ' 个');
        } else if (kind === 'stop') {
          if (!ids.length) throw new Error('这些凭据没有绑定账号 id');
          await post('/api/codex/stop-bulk', {account_ids: ids});
          ElMessage.success('已提交停止 ' + ids.length + ' 个');
        }
        else if (kind === 'download') { await post('/api/codex/download-bulk', {filenames: files}); ElMessage.success('已准备下载'); }
        else if (kind === 'cpa') { await post('/api/codex/download-bulk-from-cpa', {filenames: files}); ElMessage.success('已提交从 CPA 下载'); }
        else if (kind === 'archive') { await post('/api/codex/archive-bulk', {filenames: files, archived: true}); ElMessage.success('已归档'); }
        else if (kind === 'delete') {
          await ElMessageBox.confirm('删除 ' + files.length + ' 个凭据？', '确认', {type:'warning'});
          await post('/api/codex/delete-bulk', {filenames: files});
          ElMessage.success('已删除');
        }
        await loadCodex();
      } catch (e) { if (e !== 'cancel') ElMessage.error('操作失败：' + (e.message || e)); }
      finally { busy.value = ''; }
    }

    async function loadCodex() {
      busy.value = 'codex';
      try {
        const qs = new URLSearchParams({ paged: '1', page: String(cxPage.value), page_size: String(cxPageSize.value), q: cxQuery.value });
        const d = await api('/api/codex?' + qs.toString());
        cxRows.value = d.items || [];
        cxTotal.value = Number(d.total || cxRows.value.length || 0);
      } catch (e) { ElMessage.error('Codex 加载失败：' + e.message); }
      finally { busy.value = ''; }
    }
    function onCodexPage(p) { cxPage.value = p; loadCodex(); }
    async function deleteCodex(row) {
      try {
        await ElMessageBox.confirm('删除凭证 ' + row.filename + '？', '确认', { type: 'warning' });
        await post('/api/codex/delete', { filename: row.filename });
        ElMessage.success('已删除');
        await loadCodex();
      } catch (e) { if (e !== 'cancel') ElMessage.error('删除失败：' + (e.message || e)); }
    }
    const manualOauthOpen = ref(false), oauthEmail = ref(''), oauthUrl = ref('');
    const oauthCallback = ref(''), oauthBusy = ref(false), oauthStep = ref(0), oauthSid = ref('');
    function openManualOauth() {
      manualOauthOpen.value = true; oauthUrl.value = ''; oauthCallback.value = '';
      oauthStep.value = 0; oauthSid.value = '';
    }
    async function startOauth() {
      oauthBusy.value = true;
      try {
        const d = await post('/api/codex/oauth/start', { email: oauthEmail.value });
        if (!d.ok) throw new Error(d.error || '生成失败');
        oauthUrl.value = d.authorize_url; oauthSid.value = d.session_id; oauthStep.value = 1;
        ElMessage.success('已生成，链接 10 分钟内有效');
      } catch (e) { ElMessage.error('生成失败：' + e.message); }
      finally { oauthBusy.value = false; }
    }
    async function finishOauth() {
      oauthBusy.value = true;
      try {
        const d = await post('/api/codex/oauth/finish', { session_id: oauthSid.value, callback: oauthCallback.value });
        if (!d.ok) throw new Error(d.error || '兑换失败');
        oauthStep.value = 3;
        ElMessage.success('授权成功：' + (d.email || '已入库'));
        manualOauthOpen.value = false;
        await loadCodex();
      } catch (e) { ElMessage.error('兑换失败：' + e.message); }
      finally { oauthBusy.value = false; }
    }

    /* ---------- 任务与日志 ---------- */
    const jobRows = ref([]), logOpen = ref(false), logText = ref(''), logJobId = ref(0);
    const jobTag = (s) => ({ success: 'success', failed: 'danger', cancelled: 'info', stopped: 'warning', running: '', pending: 'info', partial_success: 'warning' }[s] || 'info');
    async function loadJobs() {
      busy.value = 'jobs';
      try {
        const d = await api('/api/jobs?limit=100');
        jobRows.value = (d.items || d.jobs || d || []).slice(0, 100);
        if (d.status_counts) jobCounts.value = d.status_counts;
      } catch (e) { ElMessage.error('任务加载失败：' + e.message); }
      finally { busy.value = ''; }
    }
    async function openLog(row) {
      logJobId.value = row.id; logText.value = '加载中…'; logOpen.value = true;
      try { const d = await api('/api/jobs/' + row.id + '/log'); logText.value = d.log || '（暂无日志）'; }
      catch (e) { logText.value = '加载失败：' + e.message; }
    }
    async function stopJob(row) {
      try { await post('/api/jobs/' + row.id + '/stop', {}); ElMessage.success('已请求停止'); await loadJobs(); }
      catch (e) { ElMessage.error('停止失败：' + e.message); }
    }
    async function retryJob(row) {
      try { await post('/api/jobs/' + row.id + '/retry', {}); ElMessage.success('已重试'); await loadJobs(); }
      catch (e) { ElMessage.error('重试失败：' + e.message); }
    }

    /* ---------- 设置 ---------- */
    const cfg = ref({}), creds = ref({}), backups = ref({});
    async function loadSettings() {
      try {
        const d = await api('/api/settings/overview');
        cfg.value = d.config || {}; creds.value = d.credentials || {}; backups.value = d.backups || {};
        if (d.switch) regRunning.value = !d.switch.paused;
      } catch (e) { ElMessage.error('设置加载失败：' + e.message); }
    }

    function switchTab(k) {
      tab.value = k;
      if (k === 'accounts') { load(); loadFunnel(); }
      else if (k === 'register') { loadSources(); loadCounts(); }
      else if (k === 'pool') { loadPool(); }
      else if (k === 'sms') { loadSms(); }
      else if (k === 'codex') { loadCodex(); }
      else if (k === 'logs') { loadJobs(); }
      else if (k === 'settings') { loadSettings(); } else if (k === 'config') { loadConfig(); }
    }

    const cfgItems = ref([]); const cfgDraft = ref({}); const cfgOriginal = ref({});
    const cfgDirty = ref({}); const cfgGroup = ref(''); const cfgFilter = ref(''); const cfgGroups = ref([]);
    const cfgVisible = computed(() => {
      const q = (cfgFilter.value || '').toLowerCase();
      return cfgItems.value.filter(it => {
        if (cfgGroup.value && it.group !== cfgGroup.value) return false;
        if (!q) return true;
        return String(it.key).toLowerCase().includes(q) || String(it.label || '').toLowerCase().includes(q);
      });
    });
    async function loadConfig() {
      busy.value = 'cfg';
      try {
        const items = await api('/api/config');
        cfgItems.value = items || [];
        const draft = {}, orig = {};
        for (const it of cfgItems.value) {
          const v = (it.type === 'list_str_multiline' && Array.isArray(it.value))
            ? it.value.join('\n') : it.value;
          draft[it.key] = v; orig[it.key] = v;
        }
        cfgDraft.value = draft; cfgOriginal.value = orig; cfgDirty.value = {};
        cfgGroups.value = Array.from(new Set(cfgItems.value.map(i => i.group).filter(Boolean)));
        if (!cfgGroup.value && cfgGroups.value.length) cfgGroup.value = cfgGroups.value[0];
      } catch (e) { ElMessage.error('配置加载失败：' + e.message); }
      finally { busy.value = ''; }
    }
    function markCfgDirty() {
      const dirty = {};
      for (const it of cfgItems.value) {
        const now = JSON.stringify(cfgDraft.value[it.key]);
        const was = JSON.stringify(cfgOriginal.value[it.key]);
        if (now !== was) dirty[it.key] = cfgDraft.value[it.key];
      }
      cfgDirty.value = dirty;
    }
    async function saveConfig() {
      const updates = {};
      for (const it of cfgItems.value) {
        const key = it.key;
        if (!(key in cfgDirty.value)) continue;
        let v = cfgDraft.value[key];
        if (it.type === 'list_str_multiline') v = String(v || '').split('\n').map(s => s.trim()).filter(Boolean);
        else if (it.type === 'int') v = parseInt(v, 10) || 0;
        else if (it.type === 'float') v = parseFloat(v) || 0;
        updates[key] = v;
      }
      if (!Object.keys(updates).length) { ElMessage.info('没有改动'); return; }
      busy.value = 'cfgsave';
      try {
        const d = await post('/api/config', {updates});
        if (d.ok === false) throw new Error(d.error || '保存失败');
        ElMessage.success('已保存 ' + Object.keys(updates).length + ' 项，部分配置需重启生效');
        await loadConfig();
      } catch (e) { ElMessage.error('保存失败：' + e.message); }
      finally { busy.value = ''; }
    }

    onMounted(() => { loadSwitch(); load(); loadFunnel(); });

    return {
      menus, tab, title, busy, cxSel, cxBulk, cfgItems, cfgDraft, cfgDirty, cfgGroup, cfgFilter, cfgGroups, cfgVisible, loadConfig, saveConfig, markCfgDirty, bulkChangeEmail, cleanupDead, cancelPending, rows, total, page, pageSize, loading, query, archived, sel, funnel,
      load, reload, onPage, onSize, switchTab, bulk, bulkNote, backfillCodex, tagType, fmt,
      regRunning, toggleRegistration, regCount, regWorkers, regSource, regDriver,
      sourceOptions, driverOptions, jobCounts, loadSources, loadCounts, startRegistration,
      poolSources, poolSource, poolRows, poolTotal, poolPage, poolQuery, poolSel,
      loadPool, reloadPool, onPoolPage, deletePool, importOpen, importText, importSource, imapServer, doImport,
      sms, smsEligible, smsReservations, loadSms, smsToggle,
      cxRows, cxTotal, cxPage, cxPageSize, cxQuery, loadCodex, onCodexPage, deleteCodex,
      manualOauthOpen, oauthEmail, oauthUrl, oauthCallback, oauthBusy, oauthStep, openManualOauth, startOauth, finishOauth,
      jobRows, logOpen, logText, logJobId, loadJobs, openLog, stopJob, retryJob, jobTag,
      cfg, creds, backups, loadSettings,
    };
  }
}).use(ElementPlus).mount('#app');
</script>
