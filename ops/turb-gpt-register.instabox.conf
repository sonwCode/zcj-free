server {
    listen 443 ssl http2;
    server_name ib.register.feixueapi.xyz;

    ssl_certificate /etc/letsencrypt/live/ib.register.feixueapi.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ib.register.feixueapi.xyz/privkey.pem;

    location / {
        proxy_pass https://5100-agqu2diewypsm25psrqkkq7v6i.instabox.tech;
        proxy_ssl_server_name on;
        proxy_ssl_name 5100-agqu2diewypsm25psrqkkq7v6i.instabox.tech;
        # InstaBox's published-port gateway routes by its generated host.
        # Keep the browser-facing host separately for the application.
        proxy_set_header Host 5100-agqu2diewypsm25psrqkkq7v6i.instabox.tech;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect off;

        proxy_connect_timeout 15s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}

server {
    listen 80;
    server_name ib.register.feixueapi.xyz;
    return 301 https://$host$request_uri;
}
